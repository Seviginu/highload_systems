spring:
  r2dbc:
    url: ${USER_R2DBC_URL:r2dbc:postgresql://localhost:55433/users}
    username: ${USER_DB_USERNAME:users}
    password: ${USER_DB_PASSWORD:users}
  liquibase:
    url: ${USER_JDBC_URL:jdbc:postgresql://localhost:55433/users}
    user: ${USER_DB_USERNAME:users}
    password: ${USER_DB_PASSWORD:users}
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: ${SERVER_PORT:8082}
app:
  jwt:
    private-key: ${JWT_PRIVATE_KEY:file:/app/keys/private.pem}
    ttl-seconds: ${JWT_TTL_SECONDS:900}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    name: ${BOOTSTRAP_ADMIN_NAME:Supervisor}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
