spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vs_lab1}
    username: ${DB_USERNAME:vs_lab1}
    password: ${DB_PASSWORD:vs_lab1}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
app:
  blocking:
    threads: ${TRACKER_BLOCKING_THREADS:10}
    queued-tasks: ${TRACKER_BLOCKING_QUEUED_TASKS:100}
  cache:
    tasks:
      ttl: ${TASK_CACHE_TTL:10m}
server:
  port: ${SERVER_PORT:8080}

spring.cloud.openfeign.client.config.user-service:
  connectTimeout: 2000
  readTimeout: 3000

spring.cloud.openfeign.circuitbreaker.enabled: true
# Feign socket timeouts bound the synchronous call on tracker-blocking.
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter: true
spring.cloud.circuitbreaker.bulkhead.resilience4j.enabled: false

resilience4j:
  circuitbreaker:
    instances:
      userDirectory:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: ${USER_CIRCUIT_WAIT_DURATION:10s}
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: false
