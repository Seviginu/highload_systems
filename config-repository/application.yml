eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    configuration-source: config-server

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:/app/keys/public.pem}
    issuer: ${JWT_ISSUER:http://task-tracker}
    audience: ${JWT_AUDIENCE:task-tracker-api}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-1:9092,kafka-2:9094,kafka-3:9096}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    admin:
      fail-fast: false
