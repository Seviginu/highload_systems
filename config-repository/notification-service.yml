server:
  port: ${SERVER_PORT:8083}
spring:
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:55434/notifications}
    username: ${NOTIFICATION_DB_USERNAME:notifications}
    password: ${NOTIFICATION_DB_PASSWORD:notifications}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      missing-topics-fatal: false
app:
  notifications:
    group-id: notifications-task-assigned-v1
