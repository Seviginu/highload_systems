server:
  port: ${SERVER_PORT:8081}

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - PreserveHostHeader
          routes:
            - id: files-api
              uri: lb://file-service
              predicates:
                - Path=/api/v1/files/**
            - id: files-openapi
              uri: lb://file-service
              predicates:
                - Path=/v3/api-docs/file-service
              filters:
                - SetPath=/v3/api-docs
            - id: notifications-api
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            - id: users-api
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**
            - id: tracker-api
              uri: lb://tracker-service
              predicates:
                - Path=/api/v1/projects/**,/api/v1/tasks/**,/api/v1/labels/**
            - id: notifications-openapi
              uri: lb://notification-service
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - SetPath=/v3/api-docs
            - id: users-openapi
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - SetPath=/v3/api-docs
            - id: tracker-openapi
              uri: lb://tracker-service
              predicates:
                - Path=/v3/api-docs/tracker-service
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: tracker-service
        url: /v3/api-docs/tracker-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: file-service
        url: /v3/api-docs/file-service

app:
  files:
    max-file-bytes: ${FILE_MAX_BYTES:10485760}
