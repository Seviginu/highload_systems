x-kafka: &kafka
  image: apache/kafka:3.9.2
  environment: &kafka-environment
    CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 3
    KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
  configs:
    - source: kafka-client
      target: /etc/kafka/client.properties
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --command-config /etc/kafka/client.properties --list >/dev/null 2>&1"]
    interval: 15s
    timeout: 12s
    retries: 12
    start_period: 20s
  restart: unless-stopped

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:3.9.2
    entrypoint: ["/bin/bash", "/etc/kafka/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_HEAP_OPTS: -Xms32m -Xmx128m
    configs:
      - source: kafka-client
        target: /etc/kafka/client.properties
      - source: kafka-init-script
        target: /etc/kafka/init-topics.sh
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-AdminPassword123!}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        condition: service_healthy
      users-db:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:3.8.0
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: tracker-cache
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: user-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      USER_R2DBC_URL: r2dbc:postgresql://users-db:5432/users
      USER_JDBC_URL: jdbc:postgresql://users-db:5432/users
      USER_DB_USERNAME: ${USER_DB_USERNAME:-users}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:-users}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Supervisor}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      JWT_ISSUER: ${JWT_ISSUER:-http://task-tracker}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-task-tracker-api}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      SERVER_PORT: 8080
    volumes:
      - ./.local/jwt/private.pem:/app/keys/private.pem:ro
      - ./.local/jwt/public.pem:/app/keys/public.pem:ro
    ports:
      - "${USER_SERVICE_PORT:-8082}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: ${USER_DB_USERNAME:-users}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:-users}
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: notification-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      NOTIFICATION_DB_URL: jdbc:postgresql://notifications-db:5432/notifications
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-notifications}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notifications}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      JWT_ISSUER: ${JWT_ISSUER:-http://task-tracker}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-task-tracker-api}
      SERVER_PORT: 8080
    volumes:
      - ./.local/jwt/public.pem:/app/keys/public.pem:ro
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      notifications-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:-notifications}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notifications}
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_ISSUER: ${JWT_ISSUER:-http://task-tracker}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-task-tracker-api}
      SERVER_PORT: 8080
    volumes:
      - ./.local/jwt/public.pem:/app/keys/public.pem:ro
    ports:
      - "${GATEWAY_PORT:-8081}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      app:
        condition: service_healthy
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: config-server
    environment:
      SERVER_PORT: 8888
      CONFIG_REPOSITORY_LOCATION: file:/config-repository/
      EUREKA_URL: http://discovery-server:8761/eureka/
    volumes:
      - ./config-repository:/config-repository:ro
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_MODULE: discovery-server
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      SERVER_PORT: 8761
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vs_lab1}
      POSTGRES_USER: ${POSTGRES_USER:-vs_lab1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vs_lab1}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_ISSUER: ${JWT_ISSUER:-http://task-tracker}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-task-tracker-api}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vs_lab1}
      DB_USERNAME: ${POSTGRES_USER:-vs_lab1}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vs_lab1}
      USER_CIRCUIT_WAIT_DURATION: ${USER_CIRCUIT_WAIT_DURATION:-10s}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TASK_CACHE_TTL: ${TASK_CACHE_TTL:-10m}
      TRACKER_BLOCKING_THREADS: ${TRACKER_BLOCKING_THREADS:-10}
      TRACKER_BLOCKING_QUEUED_TASKS: ${TRACKER_BLOCKING_QUEUED_TASKS:-100}
      SERVER_PORT: 8080
    volumes:
      - ./.local/jwt/public.pem:/app/keys/public.pem:ro
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  pgadmin-data:
  redisinsight-data:
  users-data:
  notifications-data:
  postgres-data:
  redis-data:

configs:
  kafka-client:
    file: ./infra/kafka/client.properties
  kafka-init-script:
    file: ./infra/kafka/init-topics.sh
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Tracker PostgreSQL",
            "Group": "Task tracker",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-vs_lab1}",
            "Username": "${POSTGRES_USER:-vs_lab1}",
            "SSLMode": "prefer"
          },
          "2": {
            "Name": "Users PostgreSQL",
            "Group": "Task tracker",
            "Host": "users-db",
            "Port": 5432,
            "MaintenanceDB": "users",
            "Username": "${USER_DB_USERNAME:-users}",
            "SSLMode": "prefer"
          }
        }
      }
